version: 2

models:
  - name: int_jobs_deduplicated
    description: One representative job record per canonical job identity.
    columns:
      - name: canonical_record_key
        tests:
          - not_null
          - unique
      - name: canonical_job_key
        tests:
          - not_null
          - unique
      - name: job_fingerprint
        tests:
          - not_null

  - name: int_best_rule_match
    description: Best rule-based search match per canonical job identity.
    columns:
      - name: canonical_job_key
        tests:
          - not_null
          - unique
      - name: rule_record_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jobs')
                field: record_key
      - name: best_search_id
        tests:
          - not_null
      - name: rule_score
        tests:
          - not_null

  - name: int_latest_resume_score
    description: Latest AI score per resume and canonical job identity.
    columns:
      - name: resume_hash
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_resume_profiles')
                field: resume_hash
      - name: canonical_job_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_jobs_deduplicated')
                field: canonical_job_key
      - name: scored_record_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jobs')
                field: record_key
      - name: ai_score
        tests:
          - not_null
      - name: recommendation
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['apply', 'review', 'skip']
      - name: confidence
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['high', 'medium', 'low']
